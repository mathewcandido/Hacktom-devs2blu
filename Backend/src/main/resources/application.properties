spring.application.name=TalentHub
server.port=8080

# MySQL Configuration
spring.datasource.url=jdbc:mysql://database:3306/talent_incubator?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration  
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Management endpoints - Totalmente aberto para testes
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.security.enabled=false

# Logging para debug
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG